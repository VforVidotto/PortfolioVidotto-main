<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Myccael Cesar Vidotto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Sobre mim</a></li>
            <li><a href="formacao.html">Formação</a></li>
            <li><a href="portfolio.html">Portfólio</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
        <button onclick="alternarTema()" class="btn-tema">Trocar Tema</button>
    </nav>

    <section id="contato">
        <h2>Contato</h2>
        <p>Deixe sua mensagem abaixo:</p>
        <form id="formContato">
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">
            </div>
            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">
            </div>
            <div>
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem"></textarea>
            </div>
            <!-- O botão type="button" não recarrega a página e chama o JS -->
            <button type="button" onclick="simularEnvio()">Enviar</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
